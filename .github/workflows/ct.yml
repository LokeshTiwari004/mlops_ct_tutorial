name: Continuous Training

on:
  workflow_dispatch:
    inputs:
      reason:
        description: 'why run'
        required: false
        default: 'manual'
  push:
    branches:
      - master
      - dev
    paths:
      - 'src/**'
      - 'data/iris.csv.dvc'
      - 'dvc.yaml'
      - 'dvc.lock'
      - 'requirements.txt'
  pull_request:
    branches:
      - master

# One run per ref; do not let two runs race to push dvc.lock / open the same PR.
concurrency:
  group: ct-${{ github.ref }}
  cancel-in-progress: false

jobs:
  ct:
    runs-on: ubuntu-latest
    # Never write back from a fork PR.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    permissions:
      contents: write       # push / branch / PR files
      id-token: write       # WIF OIDC
      pull-requests: write  # open + comment on PRs
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0      # real history needed to commit / push / branch

      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_SA_EMAIL }}

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - uses: iterative/setup-cml@v2

      - name: Create virtual environment and install dependencies
        run: |
          uv venv
          uv pip install -r requirements.txt

      - name: Pull DVC data and models
        run: uv run dvc pull

      - name: Reproduce DVC pipeline (data validation -> split -> train -> eval)
        run: uv run dvc repro

      - name: Push updated data and models to DVC remote
        run: uv run dvc push

      # ------------------------------------------------------------------
      # dev: push refreshed metadata straight back to dev. Protected-branch
      # rules do not apply to dev here; GITHUB_TOKEN push will NOT retrigger
      # workflows.
      # ------------------------------------------------------------------
      - name: Commit metadata directly to dev
        if: github.event_name == 'push' && github.ref_name == 'dev'
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dvc.lock dvc.yaml \
                  models/metrics.json \
                  models/training_config.json
          if git diff --cached --quiet; then
            echo "nothing to commit"
            exit 0
          fi
          git commit -m "ct: retrain on ${GITHUB_SHA} [skip ci]"
          git push \
            "https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}.git" \
            "HEAD:dev"

      - name: CML report
        env:
          # Prefer a PAT (secret CML_PAT) for commit comments; GitHub locks
          # commit-comment updates made with the default GITHUB_TOKEN.
          REPO_TOKEN: ${{ secrets.CML_PAT || secrets.GITHUB_TOKEN }}
        run: |
          BASE="${{ github.base_ref || 'master' }}"
          echo "## Metrics: vs $BASE" >> report.md
          git fetch --depth=1 origin "$BASE"
          uv run dvc metrics diff "origin/$BASE" --md >> report.md \
            || uv run dvc metrics show --md >> report.md
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            cml comment update report.md                  # PR comment
          else
            cml comment update --target=commit report.md  # commit comment (push / dispatch)
          fi
